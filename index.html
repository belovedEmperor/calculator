<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link href="style.css" rel="stylesheet" />
    <script src="index.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="display">0</div>
      <div class="buttons">
        <div class="row">
          <button class="clear">C</button>
          <button></button>
          <button></button>
          <button class="operation" data-operation="add">+</button>
        </div>
        <div class="row">
          <button class="number" data-number="7">7</button>
          <button class="number" data-number="8">8</button>
          <button class="number" data-number="9">9</button>
          <button class="operation" data-operation="subtract">-</button>
        </div>
        <div class="row">
          <button class="number" data-number="4">4</button>
          <button class="number" data-number="5">5</button>
          <button class="number" data-number="6">6</button>
          <button class="operation" data-operation="multiply">×</button>
        </div>
        <div class="row">
          <button class="number" data-number="1">1</button>
          <button class="number" data-number="2">2</button>
          <button class="number" data-number="3">3</button>
          <button class="operation" data-operation="divide">/</button>
        </div>
        <div class="row">
          <button></button>
          <button class="number" data-number="0">0</button>
          <button class="" data-number=".">.</button>
          <button class="equal">=</button>
        </div>
      </div>
    </div>
  </body>
</html>
